name: Bench Gradle restore
on:
  push:
    branches: [dpoc-sticky-flutter-bench]
jobs:
  bench:
    name: Bench Gradle restore
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-dpoc-sticky-flutter
      - nscloud-cache-allow-commit-from-dpoc-sticky-flutter
      - nscloud-cache-exp-do-not-commit
    timeout-minutes: 100
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: sticky mount (read the real Gradle cache)
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |-
            ~/.gradle/caches
            ~/.gradle/wrapper
      - name: tools
        run: |
          echo "NSC_CACHE_READONLY=${NSC_CACHE_READONLY:-unset}"
          sudo apt-get update -qq >/dev/null 2>&1; sudo apt-get install -y -qq lz4 squashfs-tools erofs-utils >/dev/null 2>&1 || echo "::warning::apt install failed"
          uname -r; command -v lz4 mksquashfs mkfs.erofs; grep -E 'erofs|squashfs|overlay' /proc/filesystems || true
      - name: bench pack
        run: .github/sticky/bench.sh pack
      - name: bench restore
        run: .github/sticky/bench.sh restore
      - name: bench gradle bin vs all
        run: .github/sticky/bench.sh bin
      - name: Namespace remote Gradle build cache
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          nsc cache gradle setup --init-gradle "$HOME/.gradle/init.d/nsc-remote-cache.gradle" && echo REMOTE-GRADLE-CACHE on
      - name: bench swap to image
        run: .github/sticky/bench.sh build erofs
      - name: Build donor AAB on the mounted image
        run: |
          if [ -L "$HOME/.gradle/caches" ]; then nix develop .#cd-android -c ./scripts/ci/cd-android.sh; else echo "BENCH build skipped: not on image"; fi
      - name: bench cleanup
        if: always()
        run: .github/sticky/bench.sh cleanup
