name: ⚡ Reusable Build

on:
  workflow_call:

jobs:
  build:
    name: Build Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: ProtoDurian/dpoc-ci-savings/.github/actions/setup-nix@v2
        with:
          reuse-nix: 'true'
          dev-shells: ci cd
          namespacelabs: 'false'
      - uses: AtomiCloud/actions.cache-bun@v2
        with:
          namespacelabs: 'false'
      - name: Build validation bundle
        run: nix develop "$ATOMI_DEV_SHELLS/ci" -c ./scripts/ci/build.sh
