name: ⚡ Reusable Build

on:
  workflow_call:

jobs:
  build:
    name: Build Validation
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-cisave-xb
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          github-slug: 'false'
          devshell-cache: 'true'
      - name: Restore dev-shell env (GitHub Actions cache, outside the volume)
        uses: actions/cache@v5
        with:
          path: /tmp/atomi-devenv
          key: atomi-devenv-ci-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
      - name: Point atomi-develop at it
        shell: bash
        run: echo "ATOMI_DEVENV_DIR=/tmp/atomi-devenv" >> "$GITHUB_ENV"
      - uses: AtomiCloud/actions.cache-bun@v2
      - name: Build validation bundle
        run: atomi-develop .#ci -c ./scripts/ci/build.sh
