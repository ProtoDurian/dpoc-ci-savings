name: ⚡ Reusable Build

on:
  workflow_call:

jobs:
  build:
    name: Build Validation
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-cisave-xa
    timeout-minutes: 20
    steps:
      - uses: ProtoDurian/dpoc-setup-nix@v3
        with:
          github-slug: 'false'
          devshell-cache: 'true'
          devshell-prewarm: '.#ci .#cd'
          flakehub-login: 'false'
      - uses: AtomiCloud/actions.cache-bun@v2
      - name: Build validation bundle
        run: atomi-develop .#ci -c ./scripts/ci/build.sh
