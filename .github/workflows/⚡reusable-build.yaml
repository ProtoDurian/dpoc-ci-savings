name: ⚡ Reusable Build

on:
  workflow_call:

jobs:
  build:
    name: Build Validation
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-cisave-vb
    timeout-minutes: 20
    steps:
      - uses: ProtoDurian/dpoc-ci-savings/.github/actions/setup-nix@v2
        with:
          reuse-nix: 'true'
      - uses: AtomiCloud/actions.cache-bun@v2
      - name: Build validation bundle
        run: nix develop .#ci -c ./scripts/ci/build.sh
