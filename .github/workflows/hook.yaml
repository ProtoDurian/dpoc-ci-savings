name: hook

on:
  push:

jobs:
  second-checkout:
    name: second checkout + cleaned workspace
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-10gb
      - nscloud-cache-tag-dpoc-cisave-xa
    timeout-minutes: 15
    steps:
      - uses: ProtoDurian/dpoc-setup-nix@v8
        with:
          github-slug: 'false'
          devshell-cache: 'true'
          flakehub-login: 'false'
          cache-size-gb: '10'
      - uses: actions/checkout@v6
      - name: Clean the workspace and the guard state
        shell: bash
        run: |
          git clean -ffdx
          rm -f "$RUNNER_TEMP/atomi-store-guard.state"
