name: ⚡ Reusable Dead Code

on:
  workflow_call:

jobs:
  dead-code:
    name: Dead Code
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-sticky-go
      - nscloud-cache-allow-commit-from-dpoc-sticky-go
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: sticky mount
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: |-
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.sticky-markers
      - name: sticky probe before
        env:
          STICKY_PATHS: |-
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          STICKY_JOB: ${{ github.job }}
        run: .github/sticky/probe.sh before
      - name: Run strict dead-code passes
        run: nix develop .#ci -c ./scripts/ci/deadcode.sh
      - name: sticky probe after + prune
        if: always()
        env:
          STICKY_PATHS: |-
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          STICKY_CAPS: |-
            ~/go/pkg/mod:2000
            ~/.cache/go-build:3000
            ~/.cache/golangci-lint:1000
          STICKY_JOB: ${{ github.job }}
          STICKY_WRITE_BRANCH: dpoc-sticky-go
        run: .github/sticky/probe.sh after
