name: ⚡ Reusable Dead Code

on:
  workflow_call:

jobs:
  dead-code:
    name: Dead Code
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-nscache-go
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: lang-cache restore go-${{ github.job }}
        uses: ./.github/actions/lang-cache
        with:
          mode: restore
          name: go-${{ github.job }}
          paths: |-
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key-files: |-
            **/go.sum
            flake.lock
            .golangci.y*ml
          key-extra: ''
          rotate: week
          write-branch: lc-go
      - name: Run strict dead-code passes
        run: nix develop .#ci -c ./scripts/ci/deadcode.sh
      - name: lang-cache save go-${{ github.job }}
        if: success()
        uses: ./.github/actions/lang-cache
        with:
          mode: save
          name: go-${{ github.job }}
          paths: |-
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key-files: |-
            **/go.sum
            flake.lock
            .golangci.y*ml
          key-extra: ''
          rotate: week
          write-branch: lc-go
