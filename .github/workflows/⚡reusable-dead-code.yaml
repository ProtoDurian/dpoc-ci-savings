name: ⚡ Reusable Dead Code

on:
  workflow_call:

jobs:
  dead-code:
    name: Dead Code
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-nscache-go
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - uses: AtomiCloud/actions.cache-go@v2
      - name: Run strict dead-code passes
        run: nix develop .#ci -c ./scripts/ci/deadcode.sh
