name: ⚡ Reusable Docker

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: ./infra/Dockerfile
      context:
        required: false
        type: string
        default: .
      platform:
        required: false
        type: string
        default: linux/arm64,linux/amd64
      version:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build Docker
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-cisave-xb
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/') && 45 || 30 }}
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          github-slug: 'false'
          devshell-cache: 'true'
      - name: Restore dev-shell env (GitHub Actions cache, outside the volume)
        uses: actions/cache@v5
        with:
          path: /tmp/atomi-devenv
          key: atomi-devenv-cd-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
      - name: Point atomi-develop at it
        shell: bash
        run: echo "ATOMI_DEVENV_DIR=/tmp/atomi-devenv" >> "$GITHUB_ENV"
      - uses: AtomiCloud/actions.setup-docker@v2
      - name: Build and push Docker
        env:
          CI_DOCKER_CONTEXT: ${{ inputs.context }}
          CI_DOCKER_IMAGE: ${{ inputs.image_name }}
          CI_DOCKER_PLATFORM: ${{ inputs.platform }}
          CI_DOCKER_PUSH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          CI_DOCKERFILE: ${{ inputs.dockerfile }}
          DOMAIN: ghcr.io
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USER: ${{ github.actor }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_REPO_REF: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          LATEST_BRANCH: main
          RELEASE_VERSION: ${{ inputs.version }}
        run: atomi-develop .#cd -c ./scripts/ci/docker.sh
