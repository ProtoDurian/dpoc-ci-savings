name: ⚡ Reusable Docker

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: ./infra/Dockerfile
      context:
        required: false
        type: string
        default: .
      platform:
        required: false
        type: string
        default: linux/arm64,linux/amd64
      version:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build Docker
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/') && 45 || 30 }}
    steps:
      - uses: ProtoDurian/dpoc-ci-savings/.github/actions/setup-nix@v2
        with:
          reuse-nix: 'true'
          dev-shells: ci cd
          namespacelabs: 'false'
      - uses: AtomiCloud/actions.setup-docker@v2
        with:
          namespacelabs: 'false'
      - name: Build and push Docker
        env:
          CI_DOCKER_CONTEXT: ${{ inputs.context }}
          CI_DOCKER_IMAGE: ${{ inputs.image_name }}
          CI_DOCKER_PLATFORM: ${{ inputs.platform }}
          CI_DOCKER_PUSH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          CI_DOCKERFILE: ${{ inputs.dockerfile }}
          DOMAIN: ghcr.io
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USER: ${{ github.actor }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_REPO_REF: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          LATEST_BRANCH: main
          RELEASE_VERSION: ${{ inputs.version }}
        run: nix develop "$ATOMI_DEV_SHELLS/cd" -c ./scripts/ci/docker.sh
