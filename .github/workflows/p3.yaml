name: P3 nix cold store sources
on:
  push:
    branches: [nsc-p3]
permissions:
  contents: read
env:
  COUNT: |
    t0=$(date +%s.%N)
    nix develop .#ci -v -c true 2> /tmp/dev.log; rc=$?
    t1=$(date +%s.%N)
    echo "T develop=$(awk -v a=$t0 -v b=$t1 'BEGIN{printf "%.1f", b-a}') rc=$rc"
    grep -oE "copying path '[^']+' from '[^']+'" /tmp/dev.log | sed -E "s/.* from '([^']+)'/\1/" | sort | uniq -c | sed 's/^/FROM /'
    echo "PATHS $(nix path-info -r .#devShells.x86_64-linux.ci 2>/dev/null | wc -l) SIZE $(nix path-info -rS .#devShells.x86_64-linux.ci 2>/dev/null | awk '{s+=$2} END{printf "%.0fMB", s/1e6}')"
jobs:
  attic:
    name: attic + nixos (today, cold store)
    runs-on: nscloud-ubuntu-26.04-amd64-2x4
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
          github-slug: 'false'
      - name: develop
        run: bash -c "$COUNT"

  mnc:
    name: magic-nix-cache (Actions cache) + attic + nixos
    runs-on: nscloud-ubuntu-26.04-amd64-2x4
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
          github-slug: 'false'
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: develop
        run: bash -c "$COUNT"


  nixcache:
    name: Namespace nixcache (blobstorage) + attic
    runs-on: nscloud-ubuntu-26.04-amd64-2x4
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
          github-slug: 'false'
      - name: start nixcache
        run: |
          t0=$(date +%s.%N)
          curl -fsSL https://public.namespaceblobs.com/nixcache/install.sh | sh
          ~/.local/bin/nixcache -cache_dir ~/.cache/nixcache
          echo "T nixcache-start=$(awk -v a=$t0 -v b=$(date +%s.%N) 'BEGIN{printf "%.1f", b-a}')"
          ~/.local/bin/nixcache -help 2>&1 | head -40 || true
          nix config show 2>/dev/null | grep -E '^(substituters|trusted-users|trusted-public-keys|extra-)' || true
      - name: develop through the proxy
        run: ./nscache-dev.sh
      - name: proxy stats
        run: grep -o "\"source\":\"[a-z]*\"" ~/.cache/nixcache/cacheproxy.log | sort | uniq -c | sed "s/^/SOURCE /"
      - name: publish closure to the proxy (signatures kept)
        if: false
        run: |
          t0=$(date +%s.%N)
          nix path-info -r /tmp/ci-profile > /tmp/closure.txt; echo "CLOSURE $(wc -l < /tmp/closure.txt) paths $(nix path-info -S -r /tmp/ci-profile | awk '{s+=$2} END{printf "%.0fMB", s/1e6}')"
          nix copy --to http://127.0.0.1:18765 $(cat /tmp/closure.txt) 2>&1 | tail -5
          echo "T copy-to-proxy=$(awk -v a=$t0 -v b=$(date +%s.%N) 'BEGIN{printf "%.1f", b-a}')"
          sleep 5
          grep -c 'fallback entry stored' ~/.cache/nixcache/cacheproxy.log | sed 's/^/FALLBACK-STORED /'
          grep -o '"source":"[a-z]*"' ~/.cache/nixcache/cacheproxy.log | sort | uniq -c | sed 's/^/SOURCE /'
          grep -iE 'error|fail|denied' ~/.cache/nixcache/cacheproxy.log | head -5
