name: ⚡ Reusable Pre-Commit

on:
  workflow_call:

jobs:
  precommit:
    name: Pre-Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: ProtoDurian/dpoc-ci-savings/.github/actions/setup-nix@v2
        with:
          reuse-nix: 'true'
          dev-shells: ci cd
          namespacelabs: 'false'
      - name: Run pre-commit
        run: nix develop "$ATOMI_DEV_SHELLS/ci" -c ./scripts/ci/pre-commit.sh
