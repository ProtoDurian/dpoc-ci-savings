name: ⚡ Reusable Pre-Commit

on:
  workflow_call:

jobs:
  precommit:
    name: Pre-Commit
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-cisave-v0
    timeout-minutes: 20
    steps:
      - uses: ProtoDurian/dpoc-ci-savings/.github/actions/setup-nix@v1
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh
