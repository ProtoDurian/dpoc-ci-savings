name: ⚡ Reusable Pre-Commit

on:
  workflow_call:

jobs:
  precommit:
    name: Pre-Commit
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-nscache-dotnet
    timeout-minutes: 20
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: lang-cache restore nuget-${{ github.job }}
        uses: ./.github/actions/lang-cache
        with:
          mode: restore
          name: nuget-${{ github.job }}
          paths: ~/.nuget/packages
          key-files: |-
            **/*.csproj
            **/Directory.Packages.props
            **/Directory.Build.props
            global.json
            .config/dotnet-tools.json
            **/packages.lock.json
            flake.lock
          key-extra: ''
          rotate: ''
          write-branch: lc-dotnet
      - name: Run pre-commit
        run: nix develop .#ci -c ./scripts/ci/pre-commit.sh
      - name: lang-cache save nuget-${{ github.job }}
        if: success()
        uses: ./.github/actions/lang-cache
        with:
          mode: save
          name: nuget-${{ github.job }}
          paths: ~/.nuget/packages
          key-files: |-
            **/*.csproj
            **/Directory.Packages.props
            **/Directory.Build.props
            global.json
            .config/dotnet-tools.json
            **/packages.lock.json
            flake.lock
          key-extra: ''
          rotate: ''
          write-branch: lc-dotnet
