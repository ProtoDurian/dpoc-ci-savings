name: ⚡ Reusable Helm

on:
  workflow_call:
    inputs:
      chart_path:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: ProtoDurian/dpoc-ci-savings/.github/actions/setup-nix@v2
        with:
          reuse-nix: 'true'
          dev-shells: ci cd
          namespacelabs: 'false'
      - name: Build and push Helm
        env:
          CHART_PATH: ${{ inputs.chart_path }}
          CI_HELM_PUSH: 'false'
          DOMAIN: ghcr.io
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USER: ${{ github.actor }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_REPO_REF: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: nix develop "$ATOMI_DEV_SHELLS/cd" -c ./scripts/ci/helm.sh
