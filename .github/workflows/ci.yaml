name: CI

on:
  push:
    branches:
      - dpoc-sticky-go
      - dpoc-sticky-go-pr

jobs:
  precommit:
    name: Pre-Commit
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-precommit.yaml
    secrets: inherit

  unit:
    name: Unit Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: unit

  int:
    name: Integration Tests
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-test.yaml
    secrets: inherit
    with:
      mode: int

  build:
    name: Build Validation
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-build.yaml
    secrets: inherit

  deadcode:
    name: Dead Code
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-dead-code.yaml
    secrets: inherit

  vuln:
    name: Vulnerability Scan
    permissions:
      contents: read
    uses: ./.github/workflows/⚡reusable-vuln.yaml
    secrets: inherit
