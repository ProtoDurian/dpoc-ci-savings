# ### flutter-base-reusable-build-android
# #### source: flutter-base
name: ⚡ Reusable Build Android

on:
  workflow_call:

jobs:
  build:
    name: Build AAB Donor
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x8-with-cache
      - nscloud-cache-size-50gb
      - nscloud-cache-tag-dpoc-sticky-flutter
      - nscloud-cache-allow-commit-from-dpoc-sticky-flutter
    timeout-minutes: 60
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: sticky mount
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: |-
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.sticky-markers
      - name: sticky probe before
        env:
          STICKY_PATHS: |-
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          STICKY_JOB: ${{ github.job }}
        run: .github/sticky/probe.sh before
      - name: Namespace remote Gradle build cache
        shell: bash
        run: |-
          mkdir -p "$HOME/.gradle/init.d"
          if nsc cache gradle setup --init-gradle "$HOME/.gradle/init.d/nsc-remote-cache.gradle"; then echo REMOTE-GRADLE-CACHE on; else echo '::warning::no remote Gradle cache'; fi
      - name: Build donor AAB
        run: nix develop .#cd-android -c ./scripts/ci/cd-android.sh
      - name: sticky probe after + prune
        if: always()
        env:
          STICKY_PATHS: |-
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          STICKY_CAPS: |-
            ~/.pub-cache:2000
            ~/.gradle/caches:6000
            ~/.gradle/wrapper:1000
          STICKY_JOB: ${{ github.job }}
          STICKY_WRITE_BRANCH: dpoc-sticky-flutter
        run: .github/sticky/probe.sh after
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: |
            build/app/outputs/bundle/raichuRelease/*.aab
            build/app/outputs/mapping/raichuRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14
    env:
      SKIP: a-cache-tags
