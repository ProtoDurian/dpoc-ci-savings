name: guard

on:
  push:

jobs:
  share:
    name: 5 fake repos on one tag
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-cisave-xa
    timeout-minutes: 25
    steps:
      - uses: ProtoDurian/dpoc-setup-nix@v6
        with:
          github-slug: 'false'
          devshell-cache: 'true'
          flakehub-login: 'false'

      # straight after setup (and any start-of-job GC), before anything re-fetches: every env
      # that has its GC roots must still have every store path it mentions
      - name: Check rooted envs right after setup
        shell: bash
        run: |
          rooted=0; rbad=0; loose=0; lbad=0
          while IFS= read -r f; do
            miss=0
            while IFS= read -r p; do [ -e "$p" ] || { miss=1; break; }; done < <(grep -oE '/nix/store/[a-z0-9]{32}-[A-Za-z0-9._+-]+' "$f" | sort -u)
            if [ -L "${f%.sh}.root" ] && [ -L "${f%.sh}.bash.root" ]; then rooted=$((rooted + 1)); rbad=$((rbad + miss)); else loose=$((loose + 1)); lbad=$((lbad + miss)); fi
          done < <(find /nix/durian-shell -name '*.sh' 2>/dev/null)
          echo "AFTER_SETUP rooted=$rooted rooted_broken=$rbad unrooted=$loose unrooted_broken=$lbad"
          df -B1 --output=used /nix | tail -n1 | awk '{printf "AFTER_SETUP DF used=%.2f GiB\n", $1/2^30}'

      # 5 fake repos (own scope + own key input), 2 shells each, two rounds in ONE job: the
      # keep-newest-8 limit sees 10 keys, with no Namespace commit lag in between
      - name: Two rounds of 5 repos x 2 shells
        shell: bash
        run: |
          for round in 1 2; do
            for r in a b c d e; do
              for s in ci cd; do
                t0=$(date +%s.%N)
                out=$(DURIAN_SHELL_SCOPE=protodurian/fake-$r DURIAN_SHELL_PATHS=fake/fake-$r.txt durian-shell .#$s -c true 2>&1)
                t1=$(date +%s.%N)
                res=$(grep -oE '\[durian-shell\] (hit|miss)' <<<"$out" | awk '{print $2}')
                echo "CALL round=$round repo=fake-$r shell=$s result=$res sec=$(awk -v a="$t0" -v b="$t1" 'BEGIN{printf "%.2f", b-a}')"
              done
            done
          done
      - name: Check every kept env
        shell: bash
        run: |
          n=0; bad=0
          while IFS= read -r f; do
            n=$((n + 1))
            while IFS= read -r p; do
              [ -e "$p" ] || { bad=$((bad + 1)); echo "MISSING $p (in $f)"; break; }
            done < <(grep -oE '/nix/store/[a-z0-9]{32}-[A-Za-z0-9._+-]+' "$f" | sort -u)
          done < <(find /nix/durian-shell -name '*.sh' 2>/dev/null)
          echo "KEPT_ENVS=$n BROKEN=$bad"
          df -B1 --output=used /nix | tail -n1 | awk '{printf "DF used=%.2f GiB\n", $1/2^30}'
