name: ⚡ Reusable Test

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or int)
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.mode == 'int' && 'Integration Tests' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-sticky-goc
      - nscloud-cache-allow-commit-from-dpoc-sticky-goc
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: sticky mount
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9
        with:
          path: |-
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/.sticky-markers
      - name: sticky probe before
        env:
          STICKY_PATHS: |-
            ~/.cache/go-build
            ~/.cache/golangci-lint
          STICKY_JOB: ${{ github.job }}-${{ inputs.mode }}
        run: .github/sticky/probe.sh before
      - name: Run ${{ inputs.mode }} coverage
        env:
          MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "${MODE}"
      - name: sticky probe after + prune
        if: always()
        env:
          STICKY_PATHS: |-
            ~/.cache/go-build
            ~/.cache/golangci-lint
          STICKY_CAPS: |-
            ~/.cache/go-build:3000
            ~/.cache/golangci-lint:1000
          STICKY_JOB: ${{ github.job }}-${{ inputs.mode }}
          STICKY_WRITE_BRANCH: dpoc-sticky-goc
        run: .github/sticky/probe.sh after
      - name: Run compiled-artifact journey
        if: inputs.mode == 'int'
        run: nix develop .#ci -c ./scripts/ci/sit.sh
      - name: Upload ${{ inputs.mode }} coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.mode }}
          path: reports/
          if-no-files-found: warn
