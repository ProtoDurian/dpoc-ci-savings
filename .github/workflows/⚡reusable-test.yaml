name: ⚡ Reusable Tests

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or int)
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.mode == 'int' && 'Integration Tests' || 'Unit Tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          github-slug: 'false'
          devshell-cache: 'true'
          namespacelabs: 'false'
      - uses: AtomiCloud/actions.cache-bun@v2
        with:
          namespacelabs: 'false'
      - name: Run ${{ inputs.mode }} tests
        env:
          TEST_MODE: ${{ inputs.mode }}
        run: atomi-develop .#ci -c ./scripts/ci/test.sh "$TEST_MODE"
      - name: Upload ${{ inputs.mode }} coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.mode }}
          path: reports/
          if-no-files-found: warn
