name: ⚡ Reusable Test

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or int)
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.mode == 'int' && 'Integration Tests' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-nscache-go
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: lang-cache restore go-${{ github.job }}-${{ inputs.mode }}
        uses: ./.github/actions/lang-cache
        with:
          mode: restore
          name: go-${{ github.job }}-${{ inputs.mode }}
          paths: |-
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key-files: |-
            **/go.sum
            flake.lock
            .golangci.y*ml
          key-extra: ''
          rotate: week
          write-branch: lc-go
      - name: Run ${{ inputs.mode }} coverage
        env:
          MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "${MODE}"
      - name: lang-cache save go-${{ github.job }}-${{ inputs.mode }}
        if: success()
        uses: ./.github/actions/lang-cache
        with:
          mode: save
          name: go-${{ github.job }}-${{ inputs.mode }}
          paths: |-
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key-files: |-
            **/go.sum
            flake.lock
            .golangci.y*ml
          key-extra: ''
          rotate: week
          write-branch: lc-go
      - name: Run compiled-artifact journey
        if: inputs.mode == 'int'
        run: nix develop .#ci -c ./scripts/ci/sit.sh
      - name: Upload ${{ inputs.mode }} coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.mode }}
          path: reports/
          if-no-files-found: warn
