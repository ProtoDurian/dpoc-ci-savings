name: ⚡ Reusable Tests

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or int)
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.mode == 'int' && 'Integration Tests' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-26.04-amd64-4x8-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-nscache-bun
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
      - name: lang-cache restore bun-modules
        uses: ./.github/actions/lang-cache
        with:
          mode: restore
          name: bun-modules
          paths: node_modules
          key-files: |-
            bun.lock
            **/package.json
            flake.lock
          key-extra: ""
          rotate: ""
          write-branch: lc-bun
      - name: Run ${{ inputs.mode }} tests
        env:
          TEST_MODE: ${{ inputs.mode }}
        run: nix develop .#ci -c ./scripts/ci/test.sh "$TEST_MODE"
      - name: lang-cache save bun-modules
        if: success()
        uses: ./.github/actions/lang-cache
        with:
          mode: save
          name: bun-modules
          paths: node_modules
          key-files: |-
            bun.lock
            **/package.json
            flake.lock
          key-extra: ""
          rotate: ""
          write-branch: lc-bun
      - name: Upload ${{ inputs.mode }} coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.mode }}
          path: reports/
          if-no-files-found: warn
