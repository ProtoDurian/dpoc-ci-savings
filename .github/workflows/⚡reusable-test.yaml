name: ⚡ Reusable Tests

on:
  workflow_call:
    inputs:
      mode:
        description: Test mode to run (unit or int)
        required: true
        type: string

jobs:
  test:
    name: ${{ inputs.mode == 'int' && 'Integration Tests' || 'Unit Tests' }}
    runs-on:
      - nscloud-ubuntu-26.04-amd64-2x4-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-dpoc-cisave-xb
    timeout-minutes: 30
    steps:
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          github-slug: 'false'
          devshell-cache: 'true'
      - name: Restore dev-shell env (GitHub Actions cache, outside the volume)
        uses: actions/cache@v5
        with:
          path: /tmp/atomi-devenv
          key: atomi-devenv-ci-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
      - name: Point atomi-develop at it
        shell: bash
        run: echo "ATOMI_DEVENV_DIR=/tmp/atomi-devenv" >> "$GITHUB_ENV"
      - uses: AtomiCloud/actions.cache-bun@v2
      - name: Run ${{ inputs.mode }} tests
        env:
          TEST_MODE: ${{ inputs.mode }}
        run: atomi-develop .#ci -c ./scripts/ci/test.sh "$TEST_MODE"
      - name: Upload ${{ inputs.mode }} coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.mode }}
          path: reports/
          if-no-files-found: warn
